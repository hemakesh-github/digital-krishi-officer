[pytest]
markers =
    performance: marks tests as performance tests (deselect with '-m "not performance"')
    asyncio: marks tests as async

asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
